<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="679" viewBox="0 0 1600 679" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">A blue continuity ribbon joins a noisy workspace window to a clean workspace window</title>
  <desc id="hero-desc">An off-white hand-drawn illustration of two rounded rectangular workspaces on a shared grey pedestal. The left workspace has restrained sketch-like noise, the right is clean, and a single blue ribbon loops between them.</desc>
