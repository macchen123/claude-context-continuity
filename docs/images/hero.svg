      <stop offset="0" stop-color="#faf9f5"/>
      <stop offset="1" stop-color="#f8f7f2"/>
    </linearGradient>
    <linearGradient id="pedestal-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1ded7"/>
      <stop offset="1" stop-color="#cbc6bf"/>
    </linearGradient>
    <linearGradient id="arch-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edeae3"/>
      <stop offset="0.52" stop-color="#d0cbc4"/>
      <stop offset="1" stop-color="#aaa59e"/>
    </linearGradient>
    <linearGradient id="ribbon-upper" x1="0" y1="0" x2="0.9" y2="0.2">
      <stop offset="0" stop-color="#1d5d9f"/>
      <stop offset="0.26" stop-color="#397fc7"/>
      <stop offset="0.56" stop-color="#2b70b8"/>
      <stop offset="0.79" stop-color="#4b8ed1"/>
      <stop offset="1" stop-color="#2266aa"/>
    </linearGradient>
    <linearGradient id="ribbon-lower" x1="0.12" y1="0.15" x2="0.96" y2="0.84">
