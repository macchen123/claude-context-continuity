<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1005" viewBox="0 0 1800 1005" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Context continuity workflow</title>
  <desc id="flow-desc">Four white cards show work, saving progress with history and notes, starting fresh in the same files and workspace, and continuing work. Faint prior cards above and blue arrows communicate persistence.</desc>
  <defs>
    <linearGradient id="flow-background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafbf8"/>
      <stop offset="1" stop-color="#f8f9f6"/>
    </linearGradient>
    <linearGradient id="front-card-fill" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <filter id="front-card-shadow" x="-18%" y="-18%" width="136%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#6c6965" flood-opacity="0.22"/>
    </filter>
    <filter id="ghost-card-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#b0aeaa" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="1800" height="1005" fill="url(#flow-background)"/>
  </g>

  <g id="upper-ghost-cards" opacity="0.35">
    <g id="ghost-work-card" filter="url(#ghost-card-shadow)">
      <rect x="91" y="55" width="305" height="285" rx="4" fill="#ffffff"/>
      <g id="ghost-work-symbols" fill="none" stroke="#dce0e2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
        <path d="M178 249 L194 211 L258 147 L281 170 L217 234 Z M258 147 L273 138 L292 157 L281 170 M178 249 L192 244 L184 237"/>
        <path d="M220 235 L220 266 M209 255 L220 266 L231 255 M282 219 L298 219 L298 267 L282 267 M268 231 L252 245 L268 258"/>
      </g>
    </g>
    <g id="ghost-history-card" filter="url(#ghost-card-shadow)">
      <rect x="529" y="55" width="306" height="285" rx="4" fill="#ffffff"/>
      <g id="ghost-history-symbols" fill="none" stroke="#dce0e2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.66">
        <path d="M682 163 L757 207 L682 251 L607 207 Z M607 223 L682 267 L757 223 M607 239 L682 283 L757 239"/>
        <path d="M607 191 L682 147 L757 191"/>
      </g>
    </g>
    <g id="ghost-restart-card" filter="url(#ghost-card-shadow)">
      <rect x="967" y="55" width="304" height="285" rx="4" fill="#ffffff"/>
      <g id="ghost-restart-symbols" fill="none" stroke="#dce5ec" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.68">
        <path d="M1042 190 C1049 161 1075 139 1119 139 C1160 139 1189 164 1197 198 M1197 198 L1211 184 M1197 198 L1197 218"/>
        <path d="M1196 233 C1187 263 1158 282 1118 282 C1079 282 1049 259 1041 226 M1041 226 L1027 242 M1041 226 L1044 207"/>
      </g>
    </g>
    <g id="ghost-continue-card" filter="url(#ghost-card-shadow)">
      <rect x="1405" y="55" width="305" height="285" rx="4" fill="#ffffff"/>
      <g id="ghost-continue-symbols" fill="none" stroke="#dce0e2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.67">
        <path d="M1483 171 C1503 148 1529 140 1557 140 C1584 140 1609 151 1630 171 C1609 193 1583 203 1557 203 C1530 203 1504 193 1483 171 Z"/>
        <circle cx="1557" cy="171" r="19"/>
        <rect x="1488" y="230" width="52" height="67" rx="6"/>
        <rect x="1547" y="222" width="62" height="83" rx="8"/>
        <rect x="1616" y="230" width="52" height="67" rx="6"/>
      </g>
    </g>
    <path id="ghost-history-trace" d="M693 13 C697 38 674 56 678 96 C681 121 700 136 697 160" fill="none" stroke="#8ec0ee" stroke-width="2.2" stroke-opacity="0.55" stroke-linecap="round"/>
  </g>

  <g id="continuity-arrows" fill="#2875c4">
    <path id="arrow-work-to-save" d="M395 467 L481 467 L481 442 L530 473 L481 504 L481 480 L395 480 Z"/>
    <path id="arrow-save-to-fresh" d="M834 467 L919 467 L919 442 L968 473 L919 504 L919 480 L834 480 Z"/>
    <path id="arrow-fresh-to-continue" d="M1270 467 L1356 467 L1356 442 L1405 473 L1356 504 L1356 480 L1270 480 Z"/>
  </g>

  <g id="front-cards">
    <g id="work-card" filter="url(#front-card-shadow)">
      <rect x="91" y="307" width="305" height="335" rx="7" fill="url(#front-card-fill)" stroke="#f0f0ee" stroke-width="1.1"/>
      <g id="work-tools-icon" fill="none" stroke="#2d2d30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path id="gear" d="M194 393 L207 393 L210 402 C214 403 218 405 221 408 L230 404 L237 416 L230 423 C231 427 231 431 230 435 L238 442 L230 454 L220 450 C217 453 213 455 209 456 L207 465 L194 465 L191 456 C187 455 183 453 180 450 L170 454 L163 442 L171 435 C170 431 170 427 171 423 L163 416 L170 404 L180 408 C183 405 187 403 191 402 Z"/>
        <circle id="gear-center" cx="201" cy="429" r="11.5"/>
        <path id="pencil-body" d="M176 528 L191 482 L269 404 C272 401 276 400 279 403 L296 420 C299 423 299 427 296 430 L204 500 Z" fill="#fdfdfc"/>
        <path id="pencil-cap" d="M269 404 L296 420 L284 432 L257 416 Z" fill="#f8f8f6"/>
        <path id="pencil-tip" d="M176 528 L181 512 L192 523 Z"/>
        <path id="code-brackets" d="M248 482 L236 482 L236 550 L248 550 M266 503 L251 517 L266 531 M283 499 L269 535 M302 503 L317 517 L302 531 M305 482 L317 482 L317 550 L305 550"/>
      </g>
    </g>

    <g id="history-card" filter="url(#front-card-shadow)">
      <rect x="529" y="307" width="306" height="335" rx="7" fill="url(#front-card-fill)" stroke="#f0f0ee" stroke-width="1.1"/>
      <g id="layered-history-papers" fill="#fbfbfa" stroke-linecap="round" stroke-linejoin="round">
        <path id="paper-layer-four" d="M682 463 L766 512 L682 555 L598 507 Z" fill="#f5f5f4" stroke="#6e6e71" stroke-width="3.8"/>
        <path id="paper-layer-three" d="M682 446 L766 495 L682 538 L598 490 Z" fill="#f8f8f7" stroke="#969699" stroke-width="3.8"/>
        <path id="paper-layer-two" d="M682 430 L766 479 L682 522 L598 474 Z" fill="#fbfbfa" stroke="#9a9a9d" stroke-width="3.8"/>
        <path id="paper-layer-one" d="M682 393 L766 436 L682 485 L598 438 Z" fill="#fbfbfa" stroke="#3f3f42" stroke-width="4.2"/>
      </g>
      <g id="history-note-leaders" fill="none" stroke="#2875c4" stroke-width="2.6" stroke-linecap="round">
        <path id="left-note-leader" d="M700 270 C678 297 649 355 653 427"/>
        <path id="right-note-leader" d="M760 269 C764 320 749 379 706 427"/>
      </g>
      <g id="history-note-dots" fill="#2875c4">
        <circle id="left-note-source" cx="700" cy="270" r="7"/>
        <circle id="right-note-source" cx="760" cy="269" r="7"/>
        <circle id="left-note-target" cx="653" cy="427" r="6.4"/>
        <circle id="right-note-target" cx="706" cy="427" r="6.4"/>
      </g>
    </g>

    <g id="fresh-start-card" filter="url(#front-card-shadow)">
      <rect x="967" y="307" width="304" height="335" rx="7" fill="url(#front-card-fill)" stroke="#f0f0ee" stroke-width="1.1"/>
      <g id="same-workspace-icon" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g id="refresh-cycle" stroke="#2875c4" stroke-width="5.2">
          <path id="refresh-top-arc" d="M1042 420 C1051 385 1082 361 1119 361 C1156 361 1188 386 1198 420"/>
          <path id="refresh-top-arrow" d="M1180 416 L1198 439 L1214 415"/>
          <path id="refresh-bottom-arc" d="M1196 487 C1186 510 1158 521 1120 521 C1083 521 1053 509 1042 487"/>
          <path id="refresh-bottom-arrow" d="M1059 491 L1041 469 L1025 493"/>
        </g>
        <g id="file-and-workspace-symbols" stroke="#303034" stroke-width="4.2">
          <path id="left-file" d="M1075 403 L1095 403 L1107 415 L1107 445 L1075 445 Z M1095 403 L1095 415 L1107 415"/>
          <path id="right-file" d="M1150 403 L1170 403 L1182 415 L1182 445 L1150 445 Z M1170 403 L1170 415 L1182 415"/>
          <path id="file-link" d="M1116 425 L1141 425" stroke-dasharray="7 7"/>
          <rect id="workspace-bar" x="1075" y="461" width="90" height="18" rx="3"/>
        </g>
      </g>
    </g>

    <g id="continue-card" filter="url(#front-card-shadow)">
      <rect x="1405" y="307" width="305" height="335" rx="7" fill="url(#front-card-fill)" stroke="#f0f0ee" stroke-width="1.1"/>
      <g id="continue-work-icon" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g id="eye-symbol" stroke="#303034" stroke-width="5">
          <path id="eye-outline" d="M1506 416 C1520 397 1537 387 1557 387 C1577 387 1594 397 1608 416 C1594 435 1577 445 1557 445 C1537 445 1520 435 1506 416 Z" fill="#fbfbfa"/>
          <circle id="eye-iris" cx="1557" cy="416" r="27" fill="#fbfbfa"/>
          <circle id="eye-pupil" cx="1557" cy="416" r="17" fill="#303034"/>
          <path id="eye-glint" d="M1548 405 C1552 399 1559 398 1565 402" stroke="#fbfbfa" stroke-width="4.2"/>
        </g>
        <g id="workspace-windows" stroke-width="4.2">
          <rect id="left-window" x="1455" y="474" width="59" height="78" rx="7" fill="#eeeeed" stroke="#b9b9b8"/>
          <rect id="right-window" x="1600" y="474" width="59" height="78" rx="7" fill="#eeeeed" stroke="#b9b9b8"/>
          <rect id="current-window-frame" x="1519" y="466" width="75" height="96" rx="13" fill="#fbfbfa" stroke="#2875c4"/>
          <rect id="current-window" x="1529" y="475" width="55" height="77" rx="5" fill="#2875c4" stroke="#303034"/>
        </g>
      </g>
    </g>
  </g>

  <g id="card-copy" fill="#050505" font-family="Inter, Arial, Helvetica, sans-serif" text-anchor="middle">
    <text id="history-notes-copy" x="745" y="245" font-size="34" font-weight="400"><tspan x="745" y="245">History + Notes</tspan></text>
    <text id="same-files-copy" x="1119" y="571" font-size="31" font-weight="500"><tspan x="1119" y="571">Same files.</tspan><tspan x="1119" y="606">Same workspace.</tspan></text>
    <text id="work-label" x="243" y="728" font-size="48" font-weight="700"><tspan x="243" y="728">Work</tspan></text>
    <text id="save-progress-label" x="682" y="728" font-size="48" font-weight="700"><tspan x="682" y="728">Save progress</tspan></text>
    <text id="start-fresh-label" x="1119" y="728" font-size="48" font-weight="700"><tspan x="1119" y="728">Start fresh</tspan></text>
    <text id="keep-going-label" x="1557" y="728" font-size="48" font-weight="700"><tspan x="1557" y="728">Keep going</tspan></text>
  </g>
</svg>
