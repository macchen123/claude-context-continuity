      <stop offset="0.48" stop-color="#2165aa"/>
      <stop offset="0.79" stop-color="#4e8ed0"/>
      <stop offset="1" stop-color="#1e5c9e"/>
    </linearGradient>
    <linearGradient id="left-screen-fill" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f5f3ee"/>
      <stop offset="1" stop-color="#e9e6df"/>
    </linearGradient>
    <linearGradient id="right-screen-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f5f1"/>
      <stop offset="1" stop-color="#f0eee9"/>
    </linearGradient>
    <radialGradient id="soft-smudge" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8a29b" stop-opacity="0.31"/>
      <stop offset="1" stop-color="#dcd8d2" stop-opacity="0"/>
